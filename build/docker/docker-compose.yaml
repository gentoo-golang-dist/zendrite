services:
  postgres:
    hostname: postgres
    image: postgres:18-alpine
    restart: always
    volumes:
      # This will create a docker volume to persist the database files in.
      # If you prefer those files to be outside of docker, you'll need to change this.
      - zendrite_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: itsasecret
      POSTGRES_USER: zendrite
      POSTGRES_DB: zendrite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendrite"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  zendrite:
    hostname: zendrite
    image: pats22/zendrite:latest
    ports:
      - 8008:8008
      - 8448:8448
    volumes:
      - ./config:/etc/zendrite
      # Media, JetStream and the search index live here.
      # This uses a docker volume, change this if you prefer to have those files outside of docker.
      - zendrite_data:/var/lib/zendrite
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    attachable: true

volumes:
  zendrite_postgres_data:
  zendrite_data:
