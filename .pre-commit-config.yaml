# cSpell:ignore checkmake hadolint autofix autoupdate commitlint
# Wire the commit-msg stage so `pre-commit install` also installs the
# commitlint hook (which validates the commit title, not the staged files).
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own stages run on staged files only; otherwise the
# commit-msg stage hands them the commit message file, which prettier rejects.
default_stages: [pre-commit]
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        exclude: ^build/(scripts|docker)/
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier
        # Vendored upstream jQuery build served by the login fallback; keep it
        # byte-identical to the release so its SRI hash stays verifiable.
        exclude: ^setup/base/static/client/login/js/jquery-[0-9.]+\.min\.js$
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint.yaml]
  - repo: local
    hooks:
      - id: vale
        name: vale
        # Run `vale sync` once to download the Microsoft package into .vale/.
        entry: vale
        language: system
        files: ^website/src/content/docs/.*\.mdx?$
      - id: yaml-file-extension
        name: Check if YAML files has *.yaml extension.
        entry: YAML filenames must have .yaml extension.
        language: fail
        files: .yml$
        # Vale only loads styles named *.yml.
        exclude: ^\.vale/
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      # Enforce Conventional Commits with a mandatory package scope; rules live
      # in .commitlintrc.json. Runs on the commit message, so it needs the
      # commit-msg stage (see default_install_hook_types above).
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
