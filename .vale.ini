StylesPath = .vale
MinAlertLevel = suggestion
Vocab = zendrite

Packages = Microsoft

[website/src/content/docs/**/*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, zendrite

Microsoft.Dashes = NO
Microsoft.Semicolon = NO
Microsoft.Headings = NO
Microsoft.HeadingColons = NO
Microsoft.OxfordComma = warning
Microsoft.Contractions = NO
Microsoft.Passive = NO
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Avoid = warning
Microsoft.Adverbs = NO
# Matrix and infrastructure docs are acronym-dense (MSC, SFU, NATS, OIDC).
Microsoft.Acronyms = NO
Microsoft.HeadingAcronyms = NO
# "Verify your use of" hints fire on plain words such as "allows" and "against".
Microsoft.Vocab = NO
# "disabled" describes features here, never people.
Microsoft.Accessibility = NO
# The Matrix specification is "the spec" in its own name and URLs.
Microsoft.Terms = NO
# "URL" is the term the Matrix specification and its MSC titles use.
Microsoft.GeneralURL = NO

# FAQ headings are the questions themselves.
[website/src/content/docs/faq.md]
Microsoft.HeadingPunctuation = NO
Microsoft.QuestionMarks = NO
