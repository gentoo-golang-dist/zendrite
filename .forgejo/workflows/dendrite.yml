name: Dendrite

on:
  push:
    branches:
      - main
    paths:
      - "**.go" # only execute on changes to go files
      - "go.sum" # or dependency updates
      - ".forgejo/workflows/**" # or workflow changes
  pull_request:
    paths:
      - "**.go"
      - "go.sum" # or dependency updates
      - ".forgejo/workflows/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run golangci-lint
  lint:
    timeout-minutes: 5
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libolm-dev libolm3 build-essential
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: 1

  # Run all tests with race detector
  test:
    timeout-minutes: 15
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libolm-dev libolm3 build-essential
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go test -race -v ./...
        env:
          POSTGRES_HOST: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dendrite

  tests-done:
    name: Tests passed
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check tests passed
        run: |
          echo "Checking job results..."
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All tests passed!"

  # Build release binaries using xgo for cross-compilation
  release-build:
    name: "Build release binaries"
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests-done]
    steps:
      - uses: actions/checkout@v6
      - name: Build with xgo
        uses: https://github.com/crazy-max/ghaction-xgo@v3
        with:
          xgo_version: latest
          go_version: file:go.mod
          dest: dist
          prefix: dendrite
          targets: linux/amd64,linux/arm64,linux/arm-7,darwin/amd64,darwin/arm64,windows/amd64
          pkg: ./cmd/dendrite
          ldflags: -s -w
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dendrite-${{ github.ref_name }}-binaries
          path: dist/*
