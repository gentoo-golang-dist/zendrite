name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.forgejo/workflows/website.yaml'
  pull_request:
    paths:
      - 'website/**'
      - '.forgejo/workflows/website.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: website
        run: bun run build

      - name: Upload artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist

  links:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist

      - name: Check links
        uses: https://github.com/glycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir dist
            --exclude-path dist/pagefind
            --no-progress
            'dist/**/*.html'
          fail: true
